name: Contribution Graph Art

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: AnkurSaini200
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/contribution-graph.svg
          animation_mode: tetromino
          tetromino_count: "5"
          palette: github-dark
          animation_duration: "8"

      - name: Push generated animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}