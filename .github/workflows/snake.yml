name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AnkurSaini200
          outputs: |
            dist/github-snake.svg?color_snake=#EF4444&color_dots=#161B22,#450A0A,#7F1D1D,#DC2626,#EF4444
            dist/github-snake-dark.svg?color_snake=#FF4444&color_dots=#161B22,#450A0A,#7F1D1D,#DC2626,#FF4444

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
