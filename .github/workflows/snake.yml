name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: AnkurSaini200
          github_token: ${{ secrets.GITHUB_TOKEN }}

          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#58A6FF
            dist/github-snake.gif?palette=github-dark&color_snake=#58A6FF

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}